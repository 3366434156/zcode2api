<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>zcode-hub · 请求监控</title>
  <link href="/static/css/app.css?v={{APP_VERSION}}" rel="stylesheet">
</head>
<body>
<div id="admin-header" data-active="/admin/monitoring"></div>

<main class="admin-main">
  <div class="page-hd">
    <div>
      <div class="page-title">请求监控</div>
      <div class="page-sub">每个请求一行台账（SQLite 持久化，保留 30 天）· Token / 缓存命中 / 首字 / 生成速度 / 结果</div>
    </div>
    <div class="page-actions">
      <span class="live-dot" id="live-dot">实时监控中</span>
      <button onclick="doRefresh()" class="page-action-btn">
        <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M20 11a8 8 0 0 0-14.6-4.6"/><path d="M4 4v5h5"/><path d="M4 13a8 8 0 0 0 14.6 4.6"/><path d="M20 20v-5h-5"/></svg>
        刷新
      </button>
      <button onclick="doClear()" class="page-action-btn" id="btn-clear">
        <svg width="14" height="14" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" fill="none"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6"/></svg>
        清空
      </button>
    </div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <div class="filter-chips" id="range-chips"></div>
    <input class="input mon-search" id="search" placeholder="搜索账号、模型、内容、错误…" oninput="onSearch(this.value)">
    <select class="input mon-select" id="status-sel" onchange="onStatus(this.value)">
      <option value="all">全部结果</option>
      <option value="ok">成功</option>
      <option value="fail">失败</option>
      <option value="completed">completed</option>
      <option value="client_aborted">client_aborted</option>
      <option value="upstream_aborted">upstream_aborted</option>
      <option value="failed">failed</option>
    </select>
  </div>

  <div class="stat-grid stat-grid-9" id="stat-grid">
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">调用</div><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M22 2 11 13"/><path d="M22 2 15 22l-4-9-9-4Z"/></svg></span></div><div class="stat-num" id="s-calls">0</div><div class="stat-sub" id="s-calls-sub"></div><div id="s-calls-spark"></div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">成功率</div><span class="stat-icon" style="color:var(--mint)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><path d="m8.5 12 2.4 2.4 4.8-4.8"/></svg></span></div><div class="stat-num" id="s-rate" style="color:var(--mint)">—</div><div class="stat-sub" id="s-rate-sub"></div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">失败</div><span class="stat-icon" style="color:var(--red)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.9"><circle cx="12" cy="12" r="8"/><path d="M15 9l-6 6"/><path d="M9 9l6 6"/></svg></span></div><div class="stat-num" id="s-fail" style="color:var(--red)">0</div><div class="stat-sub" id="s-fail-sub"></div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">换模型</div><span class="stat-icon" style="color:var(--amber)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M4 8h12"/><path d="m13 5 3 3-3 3"/><path d="M20 16H8"/><path d="m11 13-3 3 3 3"/></svg></span></div><div class="stat-num" id="s-fb" style="color:var(--amber)">0 次</div><div class="stat-sub" id="s-fb-sub">模型兜底自动切换</div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">消耗 Token</div><span class="stat-icon" style="color:var(--amber)"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M21 8a9 3 0 0 1-18 0 9 3 0 0 1 18 0Z"/><path d="M3 8v8a9 3 0 0 0 18 0V8"/></svg></span></div><div class="stat-num" id="s-tok" style="color:var(--amber)">—</div><div class="stat-sub" id="s-tok-sub"></div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">输入 / 命中</div><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg></span></div><div class="stat-num" id="s-in">—</div><div class="stat-sub" id="s-in-sub"></div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">输出</div><span class="stat-icon"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M12 15V3"/><path d="m7 8 5-5 5 5"/><path d="M5 21h14"/></svg></span></div><div class="stat-num" id="s-out">—</div><div class="stat-sub" id="s-out-sub"></div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">平均首字</div><span class="stat-icon" style="color:#6da8e8"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5"/><path d="M9 2h6"/></svg></span></div><div class="stat-num" id="s-ttfb" style="color:#6da8e8">—</div><div class="stat-sub" id="s-ttfb-sub"></div></div>
    <div class="stat-cell"><div class="stat-top"><div class="stat-label">生成速度</div><span class="stat-icon" style="color:#b78ae0"><svg viewBox="0 0 24 24" fill="none" stroke-width="1.8"><path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/></svg></span></div><div class="stat-num" id="s-tps" style="color:#b78ae0">—</div><div class="stat-sub" id="s-tps-sub"></div></div>
  </div>

  <div class="section-head">
    <div class="mon-tabs" id="mon-tabs">
      <button class="mon-tab active" data-tab="detail" onclick="setTab('detail')">明细</button>
      <button class="mon-tab" data-tab="live" onclick="setTab('live')">实时 <span class="mon-tab-count" id="live-count">0</span></button>
      <button class="mon-tab" data-tab="account" onclick="setTab('account')">账号</button>
      <button class="mon-tab" data-tab="model" onclick="setTab('model')">模型</button>
    </div>
    <div class="section-meta" id="last-updated"></div>
  </div>

  <div class="acct-list" id="list"></div>
  <div class="mon-pager" id="pager"></div>
</main>

<div class="mon-modal" id="modal" onclick="if(event.target===this)closeDetail()">
  <div class="mon-modal-card">
    <div class="mon-modal-hd">
      <div class="mon-modal-title" id="d-title">请求详情</div>
      <button class="mon-modal-x" onclick="closeDetail()">✕</button>
    </div>
    <div class="mon-modal-body" id="d-body"></div>
  </div>
</div>

<script src="/static/js/auth.js?v={{APP_VERSION}}"></script>
<script src="/static/js/toast.js?v={{APP_VERSION}}"></script>
<script src="/static/js/header.js?v={{APP_VERSION}}"></script>
<script>
let live = [];            // 内存环（含进行中）
let usage = null;         // /usage 响应：rows/total/stats/by_account/by_model/series
let tab = 'detail';
const state = { range: 'today', status: 'all', q: '', keep: 500, page: 0, limit: 100 };

const $ = id => document.getElementById(id);

function esc(s){return String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function pad(n){return String(n).padStart(2,'0');}
function fmtTs(ts){
  if(!ts)return '—';
  const d=new Date(ts*1000);
  return `${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
}
function fmtTok(n){
  if(n==null||isNaN(n))return '—';
  if(n>=1e8)return (n/1e8).toFixed(2)+' 亿';
  if(n>=1e4)return (n/1e4).toFixed(1)+' 万';
  if(n>=1e3)return (n/1e3).toFixed(1)+'K';
  return String(Math.round(n));
}
function fmtSec(v){                 // 秒 → 142ms / 1.42s
  if(v==null||isNaN(v))return '—';
  return v<1?Math.round(v*1000)+'ms':v.toFixed(2)+'s';
}
function fmtMs(ms){
  if(ms==null||isNaN(ms))return '—';
  return ms<1000?Math.round(ms)+'ms':(ms/1000).toFixed(2)+'s';
}
function fmtTps(v){
  if(v==null||isNaN(v)||v<=0)return '—';
  return v.toFixed(1);
}
function spark(vals,color){
  const w=110,h=26;
  if(!vals.length)return '';
  const max=Math.max(...vals,1);
  const pts=vals.map((v,i)=>`${(i/Math.max(vals.length-1,1))*w},${h-2-(v/max)*(h-5)}`).join(' ');
  return `<svg class="spark" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${color}" stroke-width="1.5"/></svg>`;
}

/* ── 状态徽标：outcome 是终态，HTTP 码单独显示 ───────────────────────── */
const OUTCOME_LABEL = {
  completed:'成功', failed:'失败', client_aborted:'客户端断开', upstream_aborted:'上游中断'
};
function outcomeBadge(outcome, status){
  const cls = outcome==='completed' ? 'badge-active'
            : outcome==='client_aborted' ? 'badge-cooling' : 'badge-invalid';
  const label = OUTCOME_LABEL[outcome] || outcome || '进行中';
  return `<span class="badge ${cls}">${label}</span>`;
}

/* 请求形态标记：流式 = 客户端要 SSE（请求体 "stream": true）。
   它只说明「协议形态」，与成功/失败无关：失败原因看「码」和右侧文字。
   流式才有首字；非流式的「生成」列退化为总耗时，tok/s 是端到端吞吐。 */
const STREAM_TITLE = '客户端要求流式返回（SSE，请求体 "stream": true）\n'
  + '· 首字 = 第一个内容块离开网关的时刻\n'
  + '· 生成 = 末块 − 首块，tok/s 按这个窗口算\n'
  + '非流式：首字无意义（—），生成 = 整段调用耗时';
function streamTag(stream){
  return stream ? `<span class="mon-stream" title="${STREAM_TITLE}">流式</span>` : '';
}

/* 换模型标记：客户端点的是 A，实际由 B 服务（模型兜底自动切换）。
   它只说明「发生过一次切换」，不改变结果语义——成功/失败仍看「结果」列。 */
function swapTag(e){
  const req = e.requested_model || '';
  const model = e.model || '';
  if(!req || req === model) return '';
  return `<span class="mon-swap" title="客户端请求 ${esc(req)}，实际由 ${esc(model)} 服务">换模型</span>`;
}

/* 换号标记：这个请求中途换过账号（额度用完/风控/并发满…）。悬停看完整轨迹：
   从谁换成谁、为什么。没有轨迹就什么都不显示——没换号不值得占一行。 */
function switchTag(e){
  const list = Array.isArray(e.switches) ? e.switches : [];
  if(!list.length) return '';
  const detail = list.map(s => `${s.from || '—'} → ${s.to || '—'}：${s.why || '未记录'}`).join('\n');
  return `<span class="mon-swap mon-switch" title="换号 ${list.length} 次：\n${esc(detail)}">换号 ${list.length}</span>`;
}

function statusCell(e){
  if(e.outcome==null && e.ok===null)return `<span class="badge badge-cooling">进行中</span>`;
  const outcome = e.outcome || (e.ok ? 'completed' : 'failed');
  const code = e.http_status || e.status;
  return outcomeBadge(outcome, code);
}

/* ── 统计卡：区间聚合来自服务端（翻页不改变口径） ───────────────────── */
function renderStats(){
  const s = usage?.stats || {};
  const inflight = live.filter(e=>e.ok===null).length;
  $('s-calls').textContent = s.calls ?? 0;
  $('s-calls-sub').textContent = `进行中 ${inflight} · 实时环保留 ${state.keep} 条`;
  $('s-rate').textContent = s.success_rate==null ? '—' : s.success_rate.toFixed(1)+'%';
  $('s-rate-sub').textContent = `成功 ${s.ok||0} / 失败 ${s.fail||0}`;
  $('s-fail').textContent = s.fail ?? 0;
  $('s-fail-sub').textContent = s.usage_missing ? `${s.usage_missing} 条上游未报用量` : '';
  $('s-fb').textContent = (s.fallback ?? 0) + ' 次';
  $('s-fb-sub').textContent = '模型兜底自动切换';
  const total = (s.input_tokens||0)+(s.cached_tokens||0)+(s.output_tokens||0);
  $('s-tok').textContent = total ? fmtTok(total) : '—';
  $('s-tok-sub').textContent = s.credit ? `额度 ${s.credit.toFixed(2)}` : '输入+缓存+输出';
  $('s-in').textContent = fmtTok((s.input_tokens||0)+(s.cached_tokens||0));
  $('s-in-sub').textContent = s.cache_hit_pct==null ? '缓存命中率 —'
    : `缓存命中 ${s.cache_hit_pct}% · ${fmtTok(s.cached_tokens||0)}`;
  $('s-out').textContent = fmtTok(s.output_tokens||0);
  $('s-out-sub').textContent = `占比 ${total?Math.round((s.output_tokens||0)/total*100):0}%`;
  $('s-ttfb').textContent = fmtMs(s.avg_ttft_ms);
  $('s-ttfb-sub').textContent = s.avg_total_ms ? `平均总耗时 ${fmtMs(s.avg_total_ms)}` : '';
  $('s-tps').textContent = fmtTps(s.avg_tps);
  $('s-tps-sub').textContent = s.peak_tps ? `峰值 ${s.peak_tps.toFixed(1)} tok/s` : '按生成窗口计算';

  const series = (usage?.series||[]).map(x=>x.calls);
  $('s-calls-spark').innerHTML = spark(series,'var(--amber)');
  $('live-count').textContent = live.length;
}

/* ── 明细表（服务端分页） ───────────────────────────────────────────── */
function renderDetail(){
  const rows = usage?.rows || [];
  const head = `<div class="mon-head mon-grid-detail">
    <span>时间</span><span>账号</span><span>模型</span><span>结果</span><span>码</span>
    <span>首字</span><span>生成</span><span>总耗时</span><span>输入</span><span>命中</span>
    <span>输出</span><span>tok/s</span><span>内容 / 错误</span></div>`;
  const body = rows.map((e,i)=>`
    <div class="mon-row mon-grid-detail mon-clickable" onclick="openDetail(${i})">
      <span class="mon-time">${fmtTs(e.ts)}</span>
      <span class="mon-name" title="${esc(e.account||'')}">${esc(e.account||'—')}${e.mode?` <span class="tier-b ${e.mode==='jwt'?'jwt':'other'}">${e.mode==='jwt'?'JWT':'KEY'}</span>`:''}${switchTag(e)}</span>
      <span class="mon-model" title="${esc(e.model||'')}${e.requested_model?` (请求 ${esc(e.requested_model)})`:''}">${esc(e.model||'—')}${swapTag(e)}</span>
      <span>${outcomeBadge(e.outcome, e.http_status)}${streamTag(e.stream)}</span>
      <span class="mon-num">${e.http_status??'—'}</span>
      <span class="mon-num">${fmtMs(e.ttft_ms)}</span>
      <span class="mon-num">${fmtMs(e.gen_ms)}</span>
      <span class="mon-num">${fmtMs(e.total_ms)}</span>
      <span class="mon-num">${fmtTok(e.input_tokens)}</span>
      <span class="mon-num" title="${e.cached_tokens!=null?`缓存命中 ${e.cached_tokens} tokens`:''}">${e.cache_hit_pct==null?'—':e.cache_hit_pct+'%'}</span>
      <span class="mon-num">${fmtTok(e.output_tokens)}</span>
      <span class="mon-num">${fmtTps(e.tokens_per_sec)}</span>
      <span class="mon-preview" title="${esc(e.error||e.preview||'')}">${e.error?`<span class="err-line">${esc(e.error)}</span>`:esc(e.preview||'—')}</span>
    </div>`).join('');
  $('list').innerHTML = rows.length
    ? `<div class="acct-table">${head}${body}</div>`
    : `<div class="empty-state">所选范围内没有请求</div>`;
  renderPager();
}

function renderPager(){
  if(tab!=='detail'){ $('pager').innerHTML=''; return; }
  const total = usage?.total || 0;
  const pages = Math.max(1, Math.ceil(total / state.limit));
  const page = state.page + 1;
  $('pager').innerHTML = `
    <span class="mon-pager-info">共 ${total} 条 · 第 ${page}/${pages} 页</span>
    <button class="page-action-btn" onclick="gotoPage(${state.page-1})" ${state.page<=0?'disabled':''}>上一页</button>
    <button class="page-action-btn" onclick="gotoPage(${state.page+1})" ${page>=pages?'disabled':''}>下一页</button>`;
}
function gotoPage(p){ state.page = Math.max(0, p); loadUsage().catch(()=>{}); }

/* ── 实时表（内存环，含进行中） ─────────────────────────────────────── */
function filteredLive(){
  const now = Date.now()/1000;
  const midnight = new Date(); midnight.setHours(0,0,0,0);
  const minTs = state.range==='1h' ? now-3600 : state.range==='today' ? midnight.getTime()/1000 : 0;
  const q = state.q.trim().toLowerCase();
  return live.filter(e=>{
    if(e.ts < minTs) return false;
    if(state.status==='ok' && e.ok!==true) return false;
    if(state.status==='fail' && e.ok!==false) return false;
    if(state.status!=='all' && !['ok','fail'].includes(state.status) && e.outcome!==state.status) return false;
    if(q){
      const hay = `${e.account} ${e.model} ${e.preview} ${e.error} ${e.endpoint}`.toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}

function renderLive(){
  const list = filteredLive();
  const head = `<div class="mon-head mon-grid-live">
    <span>时间</span><span>账号</span><span>模型</span><span>结果</span><span>首字</span>
    <span>生成</span><span>总耗时</span><span>输入</span><span>输出</span><span>tok/s</span><span>内容 / 错误</span></div>`;
  const body = list.slice(0,200).map(e=>{
    const ttft = e.ttft!=null ? e.ttft*1000 : null;
    const gen = (e.ttft!=null && e.t_last!=null) ? (e.t_last-e.ttft)*1000 : null;
    const tps = (gen&&gen>0&&e.output_tokens)?(e.output_tokens/(gen/1000)):null;
    const hit = (e.cached_tokens!=null && ((e.input_tokens||0)+e.cached_tokens)>0)
      ? (e.cached_tokens*100/((e.input_tokens||0)+e.cached_tokens)).toFixed(0)+'%' : '—';
    return `<div class="mon-row mon-grid-live">
      <span class="mon-time">${fmtTs(e.ts)}</span>
      <span class="mon-name" title="${esc(e.account||'')}">${esc(e.account||'—')}${e.mode?` <span class="tier-b ${e.mode==='jwt'?'jwt':'other'}">${e.mode==='jwt'?'JWT':'KEY'}</span>`:''}${switchTag(e)}</span>
      <span class="mon-model" title="${esc(e.model||'')}">${esc(e.model||'—')}${swapTag(e)}</span>
      <span>${statusCell(e)}</span>
      <span class="mon-num">${fmtMs(ttft)}</span>
      <span class="mon-num">${fmtMs(gen)}</span>
      <span class="mon-num">${fmtSec(e.t_total)}</span>
      <span class="mon-num">${fmtTok(e.input_tokens)}</span>
      <span class="mon-num" title="命中 ${hit}">${fmtTok(e.output_tokens)}</span>
      <span class="mon-num">${fmtTps(tps)}</span>
      <span class="mon-preview" title="${esc(e.error||e.preview||'')}">${e.ok===false&&e.error?`<span class="err-line">${esc(e.error)}</span>`:esc(e.preview||'—')}${e.stream?' '+streamTag(true):''}</span>
    </div>`;
  }).join('');
  $('list').innerHTML = list.length
    ? `<div class="acct-table">${head}${body}</div>`
    : `<div class="empty-state">所选时间范围内没有请求</div>`;
  $('pager').innerHTML = '';
}

/* ── 账号 / 模型聚合（服务端分组） ──────────────────────────────────── */
function renderAgg(key){
  const rows = (key==='account' ? usage?.by_account : usage?.by_model) || [];
  const head = `<div class="mon-head mon-grid-agg">
    <span>${key==='account'?'账号':'模型'}</span><span>成功率</span><span>调用</span>
    <span>输入</span><span>输出</span><span>缓存命中</span><span>平均首字</span><span>tok/s</span><span>最近请求</span></div>`;
  const body = rows.map(g=>{
    const promptAll = (g.input_tokens||0)+(g.cached_tokens||0);
    const hit = promptAll ? (g.cached_tokens*100/promptAll).toFixed(0)+'%' : '—';
    return `<div class="mon-row mon-grid-agg">
      <span class="mon-name">${esc(g.name||'—')}</span>
      <span class="mon-num">${g.success_rate==null?'—':g.success_rate+'%'}</span>
      <span class="mon-num">${g.calls}</span>
      <span class="mon-num">${fmtTok(g.input_tokens)}</span>
      <span class="mon-num">${fmtTok(g.output_tokens)}</span>
      <span class="mon-num">${hit}</span>
      <span class="mon-num">${fmtMs(g.avg_ttft_ms)}</span>
      <span class="mon-num">${fmtTps(g.avg_tps)}</span>
      <span class="mon-time">${fmtTs(g.last_ts)}</span>
    </div>`;
  }).join('');
  $('list').innerHTML = rows.length
    ? `<div class="acct-table">${head}${body}</div>`
    : `<div class="empty-state">所选范围内没有请求</div>`;
  $('pager').innerHTML = '';
}

/* ── 详情抽屉 ───────────────────────────────────────────────────────── */
function rowOf(i){
  return (usage?.rows || [])[i];
}
function openDetail(i){
  const e = rowOf(i);
  if(!e) return;
  $('d-title').textContent = `${e.model || '请求'} · ${OUTCOME_LABEL[e.outcome]||e.outcome} · ${fmtTs(e.ts)}`;
  const kv = (k,v)=>`<div class="mon-kv"><span>${k}</span><b>${v}</b></div>`;
  $('d-body').innerHTML = `
    <div class="mon-detail-grid">
      ${kv('请求 ID', `<code>${esc(e.req_id)}</code>`)}
      ${kv('时间', fmtTs(e.ts))}
      ${kv('端点', esc(e.endpoint))}
      ${kv('账号', esc(e.account||'—') + (e.mode?` · ${e.mode==='jwt'?'JWT':'API Key'}`:''))}
      ${kv('模型', esc(e.model) + (e.requested_model?` <span class="mon-muted">（请求 ${esc(e.requested_model)}）</span>`:''))}
      ${(Array.isArray(e.switches)&&e.switches.length)?`<div class="mon-detail-block"><div class="mon-detail-label">换号轨迹（${e.switches.length} 次）</div><pre class="mon-pre">${esc(e.switches.map(s=>`${s.from||'—'} → ${s.to||'—'}：${s.why||'未记录'}`).join('\n'))}</pre></div>`:''}
      ${kv('流式', e.stream?'是':'否')}
      ${kv('结果', `${OUTCOME_LABEL[e.outcome]||e.outcome}${e.http_status?` · HTTP ${e.http_status}`:''}`)}
      ${kv('首字延迟', fmtMs(e.ttft_ms))}
      ${kv('生成耗时', fmtMs(e.gen_ms))}
      ${kv('总耗时', fmtMs(e.total_ms))}
      ${kv('输入', `${fmtTok(e.input_tokens)} <span class="mon-muted">${e.input_tokens??0} tokens</span>`)}
      ${kv('缓存命中', `${e.cache_hit_pct==null?'—':e.cache_hit_pct+'%'} <span class="mon-muted">${e.cached_tokens??0} tokens</span>`)}
      ${kv('输出', `${fmtTok(e.output_tokens)} <span class="mon-muted">${e.output_tokens??0} tokens</span>`)}
      ${kv('生成速度', e.tokens_per_sec?`${fmtTps(e.tokens_per_sec)} tok/s`:'—')}
      ${kv('额度(credit)', e.credit==null?'—':String(e.credit))}
      ${kv('客户端', esc(e.client||'—'))}
    </div>
    ${e.error?`<div class="mon-detail-block"><div class="mon-detail-label">错误</div><pre class="mon-pre err-line">${esc(e.error)}</pre></div>`:''}
    <div class="mon-detail-block"><div class="mon-detail-label">请求内容预览</div><pre class="mon-pre">${esc(e.preview||'—')}</pre></div>
    ${e.usage_missing?'<div class="mon-detail-note">上游没有上报 usage：这条请求的 token 为空，但仍计入调用数与时延样本。</div>':''}`;
  $('modal').classList.add('show');
}
function closeDetail(){ $('modal').classList.remove('show'); }

/* ── 渲染调度 ───────────────────────────────────────────────────────── */
function render(){
  renderStats();
  if(tab==='live') renderLive();
  else if(tab==='detail') renderDetail();
  else renderAgg(tab);
  $('last-updated').textContent = `更新于 ${new Date().toLocaleTimeString('zh-CN',{hour12:false})}`;
}

function renderChips(){
  const defs=[['1h','1 小时'],['today','今天'],['7d','7 天'],['30d','30 天'],['all','全部']];
  $('range-chips').innerHTML = defs.map(([v,label])=>
    `<button class="filter-chip${state.range===v?' active':''}" onclick="setRange('${v}')">${label}</button>`).join('');
}

function setRange(v){ state.range=v; state.page=0; renderChips(); loadUsage().catch(()=>{}); }
function setTab(t){ tab=t; document.querySelectorAll('.mon-tab').forEach(b=>b.classList.toggle('active',b.dataset.tab===t)); render(); }
function onSearch(v){ state.q=v; state.page=0; loadUsage().catch(()=>{}); }
function onStatus(v){ state.status=v; state.page=0; loadUsage().catch(()=>{}); }

async function loadLive(){
  const res = await api('GET','/monitoring');
  live = res.entries || [];
  state.keep = res.keep || 500;
  render();
}

async function loadUsage(){
  const qs = new URLSearchParams({
    range: state.range,
    outcome: state.status,
    q: state.q,
    limit: String(state.limit),
    offset: String(state.page * state.limit),
  });
  usage = await api('GET', `/usage?${qs.toString()}`);
  render();
}

async function doRefresh(){
  try{
    await Promise.all([loadLive(), loadUsage()]);
    showToast('已刷新','success');
  }catch{ showToast('加载失败','error'); }
}

async function doClear(){
  try{
    await api('POST','/monitoring/clear');
    showToast('已清空台账','success');
    state.page = 0;
    await Promise.all([loadLive(), loadUsage()]);
  }catch{ showToast('清空失败','error'); }
}

(async()=>{
  const key = await adminKey.get();
  if(!key || !await verifyKey(ADMIN_API+'/verify',key).catch(()=>false)) return location.href='/admin/login';
  renderChips();
  await renderAdminHeader();
  await Promise.all([loadLive().catch(()=>{}), loadUsage().catch(()=>{})]);
  setInterval(()=>{ if(!document.hidden) loadLive().catch(()=>{}); }, 5000);
  setInterval(()=>{ if(!document.hidden) loadUsage().catch(()=>{}); }, 10000);
})();
</script>
</body>
